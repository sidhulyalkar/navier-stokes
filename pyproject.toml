[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-blowup-lab"
version = "5.5.0"
description = "Fail-closed research infrastructure for forcing ablation and PDE blowup mechanism discovery"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blowup-lab = "blowup_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
