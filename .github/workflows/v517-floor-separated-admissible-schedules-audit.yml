name: v5.17-floor-separated-admissible-schedules-audit

on:
  push:
    branches: ["research/v5.17.0-floor-separated-admissible-schedules"]
    paths:
      - "formal/V590CanonicalDiagonalScale.lean"
      - "formal/V510MinimalStrictSchedule.lean"
      - "formal/V510StrictScheduleSeparation.lean"
      - "formal/V517FloorSeparatedAdmissibleSchedules.lean"
      - "formal/V517ResidualFromSelectedBounds.lean"
      - ".github/workflows/v517-floor-separated-admissible-schedules-audit.yml"
  pull_request:
    paths:
      - "formal/V517FloorSeparatedAdmissibleSchedules.lean"
      - "formal/V517ResidualFromSelectedBounds.lean"
      - ".github/workflows/v517-floor-separated-admissible-schedules-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor-separated-admissible-schedules:
    name: v5.17 floor-separated canonical schedules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build schedule and residual dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.MixedDiagonalResidual
      - name: Install qualified schedule modules
        run: |
          cp formal/V590CanonicalDiagonalScale.lean upstream/NavierStokes/V590CanonicalDiagonalScale.lean
          cp formal/V510MinimalStrictSchedule.lean upstream/NavierStokes/V510MinimalStrictSchedule.lean
          cp formal/V510StrictScheduleSeparation.lean upstream/NavierStokes/V510StrictScheduleSeparation.lean
          cd upstream
          mkdir -p .lake/build/lib/lean/NavierStokes
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V590CanonicalDiagonalScale.olean NavierStokes/V590CanonicalDiagonalScale.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510MinimalStrictSchedule.olean NavierStokes/V510MinimalStrictSchedule.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510StrictScheduleSeparation.olean NavierStokes/V510StrictScheduleSeparation.lean
      - name: Compile floor-separated schedule theorem
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V517FloorSeparatedAdmissibleSchedules.lean
      - name: Compile prescribed-schedule residual bridge
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V517ResidualFromSelectedBounds.lean
      - name: Reject placeholders
        run: |
          ! grep -R -nE '\\b(sorry|admit)\\b' formal/V517FloorSeparatedAdmissibleSchedules.lean formal/V517ResidualFromSelectedBounds.lean
