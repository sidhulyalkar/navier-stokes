name: v5.10-local-strict-cut-bounds-audit

on:
  push:
    branches: ["research/v5.10.0-finite-strict-cut-bounds"]
    paths:
      - "formal/V590CanonicalDiagonalScale.lean"
      - "formal/V510MinimalStrictSchedule.lean"
      - "formal/V510FiniteStrictCutBounds.lean"
      - "formal/V510PhysicalLocalStrictCutBounds.lean"
      - ".github/workflows/v510-local-strict-cut-bounds-audit.yml"
  pull_request:
    paths:
      - "formal/V590CanonicalDiagonalScale.lean"
      - "formal/V510MinimalStrictSchedule.lean"
      - "formal/V510FiniteStrictCutBounds.lean"
      - "formal/V510PhysicalLocalStrictCutBounds.lean"
      - ".github/workflows/v510-local-strict-cut-bounds-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-strict-cut-bounds:
    name: v5.10 local-q strict cut bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build local cut-bound dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.CutStageEstimates
      - name: Install qualified v5.9/v5.10 schedule modules
        run: |
          cp formal/V590CanonicalDiagonalScale.lean upstream/NavierStokes/V590CanonicalDiagonalScale.lean
          cp formal/V510MinimalStrictSchedule.lean upstream/NavierStokes/V510MinimalStrictSchedule.lean
          cp formal/V510FiniteStrictCutBounds.lean upstream/NavierStokes/V510FiniteStrictCutBounds.lean
          cd upstream
          mkdir -p .lake/build/lib/lean/NavierStokes
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V590CanonicalDiagonalScale.olean NavierStokes/V590CanonicalDiagonalScale.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510MinimalStrictSchedule.olean NavierStokes/V510MinimalStrictSchedule.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510FiniteStrictCutBounds.olean NavierStokes/V510FiniteStrictCutBounds.lean
      - name: Compile physical local-q strict cut bounds
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V510PhysicalLocalStrictCutBounds.lean
