name: v5.10-clean-promotion-audit

on:
  push:
    branches: ["research/v5.10.0-clean-promotion"]
    paths:
      - "formal/V590CanonicalDiagonalScale.lean"
      - "formal/V590StrictScaleCrossing.lean"
      - "formal/V590GainBuysScale.lean"
      - "formal/V510MinimalStrictSchedule.lean"
      - "formal/V510FiniteStrictCutBounds.lean"
      - "formal/V510PhysicalLocalStrictCutBounds.lean"
      - "formal/V510MixedStrictSchedule.lean"
      - "formal/V510MixedStrictResidual.lean"
      - "formal/V510FinalStrictCandidate.lean"
      - ".github/workflows/v510-clean-promotion-audit.yml"
      - "docs/CURRENT_STATUS.md"
      - "docs/CLAIMS.md"
      - "docs/RESEARCH_MAP.md"
      - "README.md"
  pull_request:
    paths:
      - "formal/V590CanonicalDiagonalScale.lean"
      - "formal/V590StrictScaleCrossing.lean"
      - "formal/V590GainBuysScale.lean"
      - "formal/V510MinimalStrictSchedule.lean"
      - "formal/V510FiniteStrictCutBounds.lean"
      - "formal/V510PhysicalLocalStrictCutBounds.lean"
      - "formal/V510MixedStrictSchedule.lean"
      - "formal/V510MixedStrictResidual.lean"
      - "formal/V510FinalStrictCandidate.lean"
      - ".github/workflows/v510-clean-promotion-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualified-chain:
    name: v5.9-v5.10 qualified theorem chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1

      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"

      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Restore pinned upstream build cache
        uses: actions/cache@v5
        with:
          path: upstream/.lake/build
          key: v510-qualified-${{ runner.os }}-openai-8937a8f4-lean-v4.34.0-rc2

      - name: Build source dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.MixedCandidateAssembly

      - name: Install and compile qualified research modules
        run: |
          set -euo pipefail
          modules=(
            V590CanonicalDiagonalScale
            V590StrictScaleCrossing
            V590GainBuysScale
            V510MinimalStrictSchedule
            V510FiniteStrictCutBounds
            V510PhysicalLocalStrictCutBounds
            V510MixedStrictSchedule
            V510MixedStrictResidual
            V510FinalStrictCandidate
          )
          for f in "${modules[@]}"; do
            cp "formal/$f.lean" "upstream/NavierStokes/$f.lean"
          done
          cd upstream
          mkdir -p .lake/build/lib/lean/NavierStokes
          for f in "${modules[@]}"; do
            ~/.elan/bin/lake env lean               -o ".lake/build/lib/lean/NavierStokes/$f.olean"               "NavierStokes/$f.lean"
          done
