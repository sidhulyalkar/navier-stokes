name: lean-source-audit

on:
  push:
    branches: ["research/**"]
    paths:
      - "formal/V570*.lean"
      - ".github/workflows/lean-source-audit.yml"
  pull_request:
    paths:
      - "formal/V570*.lean"
      - ".github/workflows/lean-source-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v570-linear:
    name: v5.7 linear/localized F-H
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build linear dependency closure
        run: |
          cd upstream
          ~/.elan/bin/lake build NavierStokes.LinearWaveBounds NavierStokes.LocalizedWaveBounds
      - name: Compile Stage F improved global remainder
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570ImprovedLinearRemainder.lean
      - name: Compile Stage H improved localized retained-good
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570ImprovedLocalizedGood.lean

  v570-initializer:
    name: v5.7 initializer G-K
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build initializer dependency closure
        run: |
          cd upstream
          ~/.elan/bin/lake build NavierStokes.ActualInitialization NavierStokes.ActualInitialMean
      - id: stage_g
        name: Compile Stage G nonlinear residual propagation
        continue-on-error: true
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570InitialResidualPropagation.lean
      - id: stage_i
        name: Compile Stage I three-gate invariant promotion
        continue-on-error: true
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570InitialInvariantPromotion.lean
      - id: stage_j
        name: Compile Stage J actual initial mean sigma 2/5
        continue-on-error: true
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570InitialMeanTwoFifths.lean
      - id: stage_k
        name: Compile Stage K actual initial debt sigma 2/5
        continue-on-error: true
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V570InitialDebtTwoFifths.lean
      - name: Enforce all initializer theorem gates
        if: always()
        env:
          STAGE_G: ${{ steps.stage_g.outcome }}
          STAGE_I: ${{ steps.stage_i.outcome }}
          STAGE_J: ${{ steps.stage_j.outcome }}
          STAGE_K: ${{ steps.stage_k.outcome }}
        run: |
          set -euo pipefail
          printf 'Stage G: %s\nStage I: %s\nStage J: %s\nStage K: %s\n' \
            "$STAGE_G" "$STAGE_I" "$STAGE_J" "$STAGE_K"
          test "$STAGE_G" = success
          test "$STAGE_I" = success
          test "$STAGE_J" = success
          test "$STAGE_K" = success
