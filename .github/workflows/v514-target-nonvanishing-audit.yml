name: v5.14-target-nonvanishing-audit

on:
  push:
    branches: ["research/v5.14.0-target-nonvanishing"]
    paths:
      - "formal/V514TargetNonvanishing.lean"
      - ".github/workflows/v514-target-nonvanishing-audit.yml"
  pull_request:
    paths:
      - "formal/V514TargetNonvanishing.lean"
      - ".github/workflows/v514-target-nonvanishing-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  target-nonvanishing:
    name: v5.14 target nonvanishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1

      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"

      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build target dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.PrimaryTargetBounds

      - name: Compile target nonvanishing bridge
        run: |
          cp formal/V514TargetNonvanishing.lean upstream/NavierStokes/V514TargetNonvanishing.lean
          cd upstream
          ~/.elan/bin/lake env lean NavierStokes/V514TargetNonvanishing.lean
