name: v5.12-scale-retaining-cut-product-audit

on:
  push:
    branches: ["research/v5.12.0-scale-retaining-collar-jets"]
    paths:
      - "formal/V512ScaleRetainingCutoffJets.lean"
      - "formal/V512ScaleRetainingCutProduct.lean"
      - ".github/workflows/v512-scale-retaining-cut-product-audit.yml"
  pull_request:
    paths:
      - "formal/V512ScaleRetainingCutoffJets.lean"
      - "formal/V512ScaleRetainingCutProduct.lean"
      - ".github/workflows/v512-scale-retaining-cut-product-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scale-retaining-cut-product:
    name: v5.12 scale-retaining cut product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build cutoff-estimate dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.CutStageEstimates
      - name: Install v5.12 cutoff-jet prerequisite
        run: |
          cp formal/V512ScaleRetainingCutoffJets.lean upstream/NavierStokes/V512ScaleRetainingCutoffJets.lean
          cd upstream
          mkdir -p .lake/build/lib/lean/NavierStokes
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V512ScaleRetainingCutoffJets.olean NavierStokes/V512ScaleRetainingCutoffJets.lean
      - name: Compile scale-retaining cut product
        run: cd upstream && ~/.elan/bin/lake env lean ../formal/V512ScaleRetainingCutProduct.lean
