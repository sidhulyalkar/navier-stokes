name: v5.10-collar-geometry-audit

on:
  push:
    branches: ["research/v5.10.0-collar-geometry"]
    paths:
      - "formal/V510CutoffCollarGeometry.lean"
      - ".github/workflows/v510-collar-geometry-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collar-geometry:
    name: v5.10 cutoff collar geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1
      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"
      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build cutoff dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.SmoothCutoffs
      - name: Compile collar geometry
        run: |
          cp formal/V510CutoffCollarGeometry.lean upstream/NavierStokes/V510CutoffCollarGeometry.lean
          cd upstream
          ~/.elan/bin/lake env lean NavierStokes/V510CutoffCollarGeometry.lean
