name: v5.11-paired-comparison-audit

on:
  push:
    branches: ["research/v5.11.0-paired-cut-bounds"]
    paths:
      - "formal/V511PairedFiniteCutBounds.lean"
      - "formal/V511PairedPhysicalLocalCutBounds.lean"
      - "formal/V511PairedMixedSchedule.lean"
      - "formal/V511PairedMixedResidual.lean"
      - "formal/V511PairedStageEstimates.lean"
      - "formal/V511PairedCollarGeometry.lean"
      - "formal/V511StageTwoCutoffSeparation.lean"
      - "formal/V511LateForceResidualBridge.lean"
      - ".github/workflows/v511-paired-comparison-audit.yml"
  pull_request:
    paths:
      - "formal/V511PairedFiniteCutBounds.lean"
      - "formal/V511PairedPhysicalLocalCutBounds.lean"
      - "formal/V511PairedMixedSchedule.lean"
      - "formal/V511PairedMixedResidual.lean"
      - "formal/V511PairedStageEstimates.lean"
      - "formal/V511PairedCollarGeometry.lean"
      - "formal/V511StageTwoCutoffSeparation.lean"
      - "formal/V511LateForceResidualBridge.lean"
      - ".github/workflows/v511-paired-comparison-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paired-comparison:
    name: v5.11 paired construction and force bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1

      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"

      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build pinned dependency closure
        run: |
          cd upstream
          ~/.elan/bin/lake build \
            NavierStokes.MixedCandidateAssembly \
            NavierStokes.CandidateFromLimits

      - name: Install promoted schedule prerequisites
        run: |
          cp formal/V590CanonicalDiagonalScale.lean upstream/NavierStokes/V590CanonicalDiagonalScale.lean
          cp formal/V510MinimalStrictSchedule.lean upstream/NavierStokes/V510MinimalStrictSchedule.lean
          cp formal/V510StrictScheduleSeparation.lean upstream/NavierStokes/V510StrictScheduleSeparation.lean
          cd upstream
          mkdir -p .lake/build/lib/lean/NavierStokes
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V590CanonicalDiagonalScale.olean NavierStokes/V590CanonicalDiagonalScale.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510MinimalStrictSchedule.olean NavierStokes/V510MinimalStrictSchedule.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V510StrictScheduleSeparation.olean NavierStokes/V510StrictScheduleSeparation.lean

      - name: Compile paired finite and local cutoff layers
        run: |
          cp formal/V511PairedFiniteCutBounds.lean upstream/NavierStokes/V511PairedFiniteCutBounds.lean
          cp formal/V511PairedPhysicalLocalCutBounds.lean upstream/NavierStokes/V511PairedPhysicalLocalCutBounds.lean
          cd upstream
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V511PairedFiniteCutBounds.olean NavierStokes/V511PairedFiniteCutBounds.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V511PairedPhysicalLocalCutBounds.olean NavierStokes/V511PairedPhysicalLocalCutBounds.lean

      - name: Compile paired mixed construction layers
        run: |
          cp formal/V511PairedMixedSchedule.lean upstream/NavierStokes/V511PairedMixedSchedule.lean
          cp formal/V511PairedMixedResidual.lean upstream/NavierStokes/V511PairedMixedResidual.lean
          cp formal/V511PairedStageEstimates.lean upstream/NavierStokes/V511PairedStageEstimates.lean
          cd upstream
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V511PairedMixedSchedule.olean NavierStokes/V511PairedMixedSchedule.lean
          ~/.elan/bin/lake env lean -o .lake/build/lib/lean/NavierStokes/V511PairedMixedResidual.olean NavierStokes/V511PairedMixedResidual.lean
          ~/.elan/bin/lake env lean NavierStokes/V511PairedStageEstimates.lean

      - name: Compile paired collar and stage-two geometry
        run: |
          cp formal/V511PairedCollarGeometry.lean upstream/NavierStokes/V511PairedCollarGeometry.lean
          cp formal/V511StageTwoCutoffSeparation.lean upstream/NavierStokes/V511StageTwoCutoffSeparation.lean
          cd upstream
          ~/.elan/bin/lake env lean NavierStokes/V511PairedCollarGeometry.lean
          ~/.elan/bin/lake env lean NavierStokes/V511StageTwoCutoffSeparation.lean

      - name: Compile late presingular force bridge
        run: |
          cp formal/V511LateForceResidualBridge.lean upstream/NavierStokes/V511LateForceResidualBridge.lean
          cd upstream
          ~/.elan/bin/lake env lean NavierStokes/V511LateForceResidualBridge.lean
