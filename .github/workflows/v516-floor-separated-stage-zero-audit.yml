name: v5.16-floor-separated-stage-zero-audit

on:
  push:
    branches: ["research/v5.16.0-floor-separated-stage-zero"]
    paths:
      - "formal/V516FloorSeparatedStageZero.lean"
      - ".github/workflows/v516-floor-separated-stage-zero-audit.yml"
  pull_request:
    paths:
      - "formal/V516FloorSeparatedStageZero.lean"
      - ".github/workflows/v516-floor-separated-stage-zero-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor-separated-stage-zero:
    name: v5.16 floor-separated stage-zero isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned OpenAI formalization
        uses: actions/checkout@v4
        with:
          repository: openai/NavierStokesAndEuler
          ref: 8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538
          path: upstream
          fetch-depth: 1

      - name: Verify source lock
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "8937a8f4cbc7abaab5e9e97d1cc7f5d2319d9538"
          test "$(cat upstream/lean-toolchain)" = "leanprover/lean4:v4.34.0-rc2"

      - name: Install pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: upstream
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build diagonal dependency closure
        run: cd upstream && ~/.elan/bin/lake build NavierStokes.SolenoidalDiagonal NavierStokes.SmoothCutoffs

      - name: Compile floor-separated stage-zero witness
        run: |
          cp formal/V516FloorSeparatedStageZero.lean upstream/NavierStokes/V516FloorSeparatedStageZero.lean
          cd upstream
          ~/.elan/bin/lake env lean NavierStokes/V516FloorSeparatedStageZero.lean

      - name: Reject placeholders
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' formal/V516FloorSeparatedStageZero.lean
